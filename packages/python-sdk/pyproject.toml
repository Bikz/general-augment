[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "general-augment-sdk"
version = "0.1.0"
description = "Python SDK for the General Augment admin and integration APIs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "General Augment" }]
dependencies = [
    "httpx>=0.28.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Documentation = "https://docs.generalaugment.com"
Source = "https://github.com/Bikz/general-augment"

[tool.hatch.build.targets.wheel]
packages = ["src/genaug"]
