openapi: 3.0.3
info:
  title: Simple Inventory API
  version: 1.0.0
  description: Small fixture for OpenAPI parser tests.
servers:
  - url: https://api.example.com/v1
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Item:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Unique item id.
        name:
          type: string
          description: Human-readable item name.
        quantity:
          type: integer
          description: Available inventory count.
paths:
  /items:
    get:
      operationId: list_items
      summary: List inventory items
      description: Get inventory items visible to the current user.
      tags: [inventory]
      parameters:
        - name: limit
          in: query
          description: Maximum number of items to return.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Inventory items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
    post:
      operationId: create_item
      summary: Create inventory item
      description: Create a new inventory item for the user.
      tags: [inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Item name.
                quantity:
                  type: integer
                  description: Initial quantity.
      responses:
        "201":
          description: Created item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
  /items/{item_id}:
    parameters:
      - name: item_id
        in: path
        required: true
        description: Item id.
        schema:
          type: string
    get:
      operationId: get_item
      summary: Get inventory item
      description: Get one inventory item by id.
      tags: [inventory]
      responses:
        "200":
          description: Item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
    patch:
      operationId: update_item
      summary: Update inventory item
      description: Update an item name or quantity.
      tags: [inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                quantity:
                  type: integer
      responses:
        "200":
          description: Updated item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
    delete:
      operationId: delete_item
      summary: Delete inventory item
      description: Delete an inventory item by id.
      tags: [inventory]
      responses:
        "204":
          description: Deleted.
