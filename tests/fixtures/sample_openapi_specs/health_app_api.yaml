openapi: 3.0.3
info:
  title: Mysti Health API
  version: 1.2.0
  description: Health records, symptoms, blood tests, and appointments.
servers:
  - url: https://health.example.com/api
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    PatientOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://health.example.com/oauth/authorize
          tokenUrl: https://health.example.com/oauth/token
          scopes:
            records:read: Read health records.
            appointments:write: Manage appointments.
  schemas:
    HealthRecord:
      type: object
      required: [record_id, title, recorded_at]
      properties:
        record_id:
          type: string
        title:
          type: string
        recorded_at:
          type: string
          format: date-time
        summary:
          type: string
    SymptomLog:
      type: object
      required: [symptom, severity]
      properties:
        symptom:
          type: string
          description: Symptom the user reports.
        severity:
          type: integer
          minimum: 1
          maximum: 10
        notes:
          type: string
    Appointment:
      type: object
      required: [appointment_id, starts_at]
      properties:
        appointment_id:
          type: string
        starts_at:
          type: string
          format: date-time
        clinician:
          type: string
paths:
  /records:
    get:
      operationId: list_health_records
      summary: List health records
      description: Get the user's recent health records.
      tags: [records]
      responses:
        "200":
          description: Health records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      $ref: "#/components/schemas/HealthRecord"
  /records/{record_id}:
    get:
      operationId: get_health_record
      summary: Get health record
      description: Get one health record by id.
      tags: [records]
      parameters:
        - name: record_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Health record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthRecord"
  /symptoms:
    post:
      operationId: record_symptom
      summary: Record symptom
      description: Record a symptom reported by the user.
      tags: [symptoms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SymptomLog"
      responses:
        "201":
          description: Recorded symptom.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymptomLog"
  /blood-tests:
    get:
      operationId: list_blood_tests
      summary: List blood tests
      description: Get recent blood test results.
      tags: [records]
      responses:
        "200":
          description: Blood tests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tests:
                    type: array
                    items:
                      type: object
  /appointments:
    get:
      operationId: list_appointments
      summary: List appointments
      description: Get upcoming healthcare appointments.
      tags: [appointments]
      responses:
        "200":
          description: Appointments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Appointment"
    post:
      operationId: create_appointment
      summary: Create appointment
      description: Request a new appointment.
      tags: [appointments]
      security:
        - PatientOAuth: [appointments:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_at, clinician]
              properties:
                starts_at:
                  type: string
                  format: date-time
                clinician:
                  type: string
      responses:
        "201":
          description: Created appointment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
